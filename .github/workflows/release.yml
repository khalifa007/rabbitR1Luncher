name: Build and Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # The release APK is signed with the LineageOS platform key so its
      # signature matches the prebuilt /system/app/R1Launcher/ in CarrotOS
      # (LOCAL_CERTIFICATE := platform). The keystore is .gitignored — CI
      # gets it by base64-decoding the PLATFORM_KEYSTORE_B64 repo secret.
      - name: Restore platform.keystore from secret
        env:
          # Pulling the secret in via env (instead of `${{ }}` substitution
          # inside the script) avoids shell-interpolation issues with newlines
          # and keeps GitHub's secret redaction working on every line.
          KEYSTORE_B64: ${{ secrets.PLATFORM_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::PLATFORM_KEYSTORE_B64 secret is not set."
            echo "::error::Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Diagnostic — char count is not sensitive (GH redacts the value).
          echo "secret length: $(printf '%s' "$KEYSTORE_B64" | wc -c)"
          # Tolerate line-wrapped output (`base64` without -w 0) and any pasted
          # whitespace by stripping non-base64 chars before decoding.
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' \
            | base64 -d --ignore-garbage > platform.keystore
          echo "decoded size: $(wc -c < platform.keystore) bytes"
          # Sanity check: PKCS12 magic bytes are 30 82, refuse to proceed otherwise.
          if ! head -c 2 platform.keystore | xxd -p | grep -q "^3082"; then
            echo "::error::Decoded keystore is not a valid PKCS12 file."
            echo "::error::First 8 bytes: $(head -c 8 platform.keystore | xxd -p)"
            exit 1
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Extract Version Name
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.VERSION_NAME }}"
          name: "Release v${{ env.VERSION_NAME }}"
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
